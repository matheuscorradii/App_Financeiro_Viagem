<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F6F3">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<title>Contas da Viagem</title>
<style>
  :root {
    --bg: #F7F6F3; --card: #FFFFFF; --line: #EAEAEA; --ink: #2F3437; --muted: #787774;
    --red: #9F2F2D; --red-bg: #FDEBEC; --green: #346538; --green-bg: #EDF3EC;
    --blue: #1F6C9F; --blue-bg: #E1F3FE; --yellow: #956400; --yellow-bg: #FBF3DB;
    --sans: 'Geist', 'SF Pro Display', 'Helvetica Neue', sans-serif;
    --serif: 'Newsreader', 'Playfair Display', serif;
    --mono: 'Geist Mono', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.6; padding-bottom: 88px; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(247,246,243,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 14px 16px; }
  header .in { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
  header span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  main { padding: 20px 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 14px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  input, select { width: 100%; padding: 11px 12px; font: 16px var(--sans); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; background: #FBFBFA; outline: none; transition: border-color .2s; }
  input:focus, select:focus { border-color: #BDBDBA; background: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; font: 500 15px var(--sans); border: 1px solid #111; border-radius: 6px; background: #111; color: #fff; cursor: pointer; transition: background .2s, transform .1s; }
  .btn:active { transform: scale(0.98); }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn.full { width: 100%; margin-top: 16px; }
  .icon-btn { background: none; border: 0; padding: 6px; color: var(--muted); cursor: pointer; border-radius: 6px; display: inline-flex; }
  .icon-btn:active { background: var(--bg); }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label { margin: 0; padding: 7px 12px; border: 1px solid var(--line); border-radius: 9999px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .chips input { display: none; }
  .chips label:has(input:checked) { background: #111; color: #fff; border-color: #111; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border: 0; padding-bottom: 0; }
  .item:first-child { padding-top: 0; }
  .item .t { min-width: 0; }
  .item .t b { font-weight: 500; }
  .item .r { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .num { font-family: var(--mono); font-size: 14px; }
  .big { font-family: var(--serif); font-size: 40px; letter-spacing: -0.03em; line-height: 1.1; margin: 4px 0; }
  .tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
  .tag.r { background: var(--red-bg); color: var(--red); }
  .tag.g { background: var(--green-bg); color: var(--green); }
  .tag.b { background: var(--blue-bg); color: var(--blue); }
  .tag.y { background: var(--yellow-bg); color: var(--yellow); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .grid .card { margin: 0; padding: 16px; }
  .grid .card .v { font-family: var(--serif); font-size: 24px; letter-spacing: -0.02em; line-height: 1.2; }
  .editing { border-color: #111; }
  .hide { display: none !important; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav .in { display: flex; max-width: 640px; margin: 0 auto; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; color: var(--muted); padding: 10px 4px 12px; font: 500 11px var(--sans); letter-spacing: .02em; cursor: pointer; }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: #111; }
  .tab { display: none; }
  .tab.on { display: block; }
  @media (prefers-reduced-motion: no-preference) {
    .tab.on > * { animation: up .6s cubic-bezier(.16,1,.3,1) both; }
    .tab.on > *:nth-child(2) { animation-delay: 80ms; }
    .tab.on > *:nth-child(3) { animation-delay: 160ms; }
    .tab.on > *:nth-child(4) { animation-delay: 240ms; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } }
  }
</style>
</head>
<body>
<header><div class="in"><h1>Contas da Viagem</h1><span id="hd-total"></span></div></header>
<main>

<!-- RESUMO -->
<section class="tab on" id="t-resumo">
  <div class="grid">
    <div class="card"><p class="eyebrow">Total dividido</p><div class="v" id="r-total"></div></div>
    <div class="card"><p class="eyebrow">Caixinha</p><div class="v" id="r-caixa"></div></div>
  </div>
  <div class="card"><h2>Saldo de cada um</h2><div id="saldos"></div></div>
  <div class="card"><h2>Quem deve a quem</h2><div id="sugestoes"></div></div>
  <div class="card"><h2>Detalhamento</h2>
    <p class="eyebrow">Gastos</p><div id="r-gastos"></div>
    <p class="eyebrow" style="margin-top:20px">Pagamentos de acerto</p><div id="acertos"></div>
  </div>
</section>

<!-- GASTOS -->
<section class="tab" id="t-gastos">
  <div class="card" id="g-card">
    <h2 id="g-titulo">Novo gasto</h2>
    <label>Descrição</label><input id="g-desc" placeholder="Hotel, Uber, ingresso...">
    <div class="row">
      <div><label>Valor (R$)</label><input id="g-valor" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Data</label><input id="g-data" type="date"></div>
    </div>
    <label>Quem pagou</label><select id="g-pagou"></select>
    <label>Dividir entre</label><div class="chips" id="g-part"></div>
    <button class="btn full" id="g-btn" onclick="salvarGasto()">Adicionar gasto</button>
    <button class="btn ghost full hide" id="g-cancel" onclick="limparGasto()">Cancelar edição</button>
  </div>
  <div class="card"><h2>Gastos</h2><div id="lista-gastos"></div></div>
</section>

<!-- CAIXINHA -->
<section class="tab" id="t-caixa">
  <div class="card">
    <p class="eyebrow">Saldo da caixinha Pix</p>
    <div class="big" id="cx-saldo"></div>
    <div class="muted" id="cx-info"></div>
  </div>
  <div class="card" id="c-card">
    <h2 id="c-titulo">Movimentar caixinha</h2>
    <div class="chips" id="c-tipo">
      <label><input type="radio" name="ctipo" value="gasto" checked>Gasto</label>
      <label><input type="radio" name="ctipo" value="aporte">Adicionar valor</label>
    </div>
    <label>Descrição</label><input id="c-desc" placeholder="Almoço, jantar...">
    <div class="row">
      <div><label>Valor (R$)</label><input id="c-valor" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Data</label><input id="c-data" type="date"></div>
    </div>
    <button class="btn full" id="c-btn" onclick="salvarCaixa()">Salvar</button>
    <button class="btn ghost full hide" id="c-cancel" onclick="limparCaixa()">Cancelar edição</button>
  </div>
  <div class="card"><h2>Movimentações</h2><div id="lista-caixa"></div></div>
</section>

<!-- PESSOAS -->
<section class="tab" id="t-pessoas">
  <div class="card">
    <h2>Pessoas</h2>
    <div class="row"><input id="p-nome" placeholder="Nome"><button class="btn" onclick="addPessoa()" style="flex:0">Adicionar</button></div>
    <div id="lista-pessoas" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>Registrar acerto</h2>
    <div class="row">
      <div><label>Quem pagou</label><select id="a-de"></select></div>
      <div><label>Para quem</label><select id="a-para"></select></div>
    </div>
    <div class="row">
      <div><label>Valor (R$)</label><input id="a-valor" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Data</label><input id="a-data" type="date"></div>
    </div>
    <button class="btn full" onclick="addAcerto()">Registrar acerto</button>
  </div>
  <div class="card">
    <h2>Backup</h2>
    <p class="muted" style="margin-top:0">Os dados ficam só neste celular. Exporte de vez em quando.</p>
    <div class="row">
      <button class="btn ghost" onclick="exportar()">Exportar</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">Importar</button>
    </div>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(this)">
  </div>
</section>

</main>
<nav><div class="in">
  <button class="on" data-t="resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
  <button data-t="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/></svg>Gastos</button>
  <button data-t="caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2M6 6V4h12v2"/></svg>Caixinha</button>
  <button data-t="pessoas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/></svg>Pessoas</button>
</div></nav>

<script>
const KEY = 'viagem-contas';
let db = JSON.parse(localStorage.getItem(KEY) || 'null') ||
  { pessoas: [], gastos: [], caixa: [], acertos: [] };
// migra versão antiga (valor inicial único) para movimentação de aporte
if (db.caixaInicial) db.caixa.unshift({ id: 'ini', tipo: 'aporte', desc: 'Valor inicial', valor: db.caixaInicial, data: (db.caixa[0] || {}).data || new Date().toISOString().slice(0, 10) });
delete db.caixaInicial;
db.caixa.forEach(c => c.tipo = c.tipo || 'gasto');

let editGasto = null, editCaixa = null;

const $ = id => document.getElementById(id);
const brl = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const cents = v => Math.round(parseFloat(String(v).replace(',', '.')) * 100);
const hoje = () => new Date().toISOString().slice(0, 10);
const dataBR = d => d.split('-').reverse().join('/');
const nome = id => (db.pessoas.find(p => p.id === id) || { nome: '?' }).nome;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const porData = (a, b) => b.data.localeCompare(a.data);
const salvar = () => { localStorage.setItem(KEY, JSON.stringify(db)); render(); };
const ICON_EDIT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>';
const ICON_DEL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const btnEdit = fn => `<button class="icon-btn" onclick="${fn}" aria-label="Editar">${ICON_EDIT}</button>`;
const btnDel = fn => `<button class="icon-btn" onclick="${fn}" aria-label="Apagar">${ICON_DEL}</button>`;
const vazio = t => `<span class="muted">${t}</span>`;

// Saldo > 0: tem a receber. Saldo < 0: deve.
function saldos() {
  const s = {};
  db.pessoas.forEach(p => s[p.id] = 0);
  db.gastos.forEach(g => {
    const n = g.part.length, base = Math.floor(g.valor / n);
    s[g.pagou] = (s[g.pagou] || 0) + g.valor;
    // centavos que sobram vão para os primeiros participantes
    g.part.forEach((id, i) => s[id] = (s[id] || 0) - base - (i < g.valor - base * n ? 1 : 0));
  });
  db.acertos.forEach(a => { s[a.de] += a.valor; s[a.para] -= a.valor; });
  return s;
}

function sugestoes(s) {
  const dev = [], rec = [];
  for (const id in s) {
    if (s[id] < 0) dev.push({ id, v: -s[id] });
    if (s[id] > 0) rec.push({ id, v: s[id] });
  }
  dev.sort((a, b) => b.v - a.v); rec.sort((a, b) => b.v - a.v);
  const out = [];
  let i = 0, j = 0;
  while (i < dev.length && j < rec.length) {
    const v = Math.min(dev[i].v, rec[j].v);
    out.push({ de: dev[i].id, para: rec[j].id, valor: v });
    dev[i].v -= v; rec[j].v -= v;
    if (!dev[i].v) i++;
    if (!rec[j].v) j++;
  }
  return out;
}

const linhaGasto = (g, acoes) => `<div class="item">
  <div class="t"><b>${g.desc}</b><br><span class="muted">${dataBR(g.data)} · pagou ${nome(g.pagou)} · ${g.part.length === db.pessoas.length ? 'todos' : g.part.map(nome).join(', ')}</span></div>
  <div class="r"><span class="num">${brl(g.valor)}</span>${acoes ? btnEdit(`editarGasto('${g.id}')`) + btnDel(`del('gastos','${g.id}')`) : ''}</div></div>`;

function renderPart(marcados) {
  $('g-part').innerHTML = db.pessoas.map(p =>
    `<label><input type="checkbox" value="${p.id}" ${!marcados || marcados.includes(p.id) ? 'checked' : ''}>${p.nome}</label>`).join('') || vazio('Cadastre pessoas primeiro');
}

function render() {
  const opts = db.pessoas.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
  ['g-pagou', 'a-de', 'a-para'].forEach(id => { const v = $(id).value; $(id).innerHTML = opts; if (v) $(id).value = v; });
  if (!editGasto) renderPart();

  const s = saldos();
  const total = db.gastos.reduce((t, g) => t + g.valor, 0);
  const cx = db.caixa.reduce((t, c) => t + (c.tipo === 'aporte' ? c.valor : -c.valor), 0);
  $('r-total').textContent = brl(total);
  $('r-caixa').textContent = brl(cx);
  $('hd-total').textContent = db.pessoas.length + ' pessoas';

  $('saldos').innerHTML = db.pessoas.map(p => `<div class="item"><span>${p.nome}</span>
    <span class="r">${s[p.id] < 0 ? '<span class="tag r">deve</span>' : s[p.id] > 0 ? '<span class="tag g">recebe</span>' : '<span class="tag b">ok</span>'}
    <span class="num" style="margin-left:8px">${brl(Math.abs(s[p.id]))}</span></span></div>`).join('')
    || vazio('Cadastre as pessoas na aba Pessoas');

  $('sugestoes').innerHTML = sugestoes(s).map(t => `<div class="item">
    <div class="t"><b>${nome(t.de)}</b> paga <b>${nome(t.para)}</b><br><span class="num">${brl(t.valor)}</span></div>
    <button class="btn ghost sm" onclick="quitar('${t.de}','${t.para}',${t.valor})">Marcar pago</button></div>`).join('')
    || vazio('Tudo acertado');

  $('r-gastos').innerHTML = db.gastos.slice().sort(porData).map(g => linhaGasto(g, false)).join('') || vazio('Nenhum gasto');
  $('lista-gastos').innerHTML = db.gastos.slice().sort(porData).map(g => linhaGasto(g, true)).join('') || vazio('Nenhum gasto');

  $('acertos').innerHTML = db.acertos.slice().sort(porData).map(a => `<div class="item">
    <div class="t"><b>${nome(a.de)}</b> pagou <b>${nome(a.para)}</b><br><span class="muted">${dataBR(a.data)}</span></div>
    <div class="r"><span class="num">${brl(a.valor)}</span>${btnDel(`del('acertos','${a.id}')`)}</div></div>`).join('')
    || vazio('Nenhum');

  const aportes = db.caixa.filter(c => c.tipo === 'aporte').reduce((t, c) => t + c.valor, 0);
  $('cx-saldo').textContent = brl(cx);
  $('cx-saldo').style.color = cx < 0 ? 'var(--red)' : '';
  $('cx-info').textContent = `Entrou ${brl(aportes)} · gasto ${brl(aportes - cx)}`;
  $('lista-caixa').innerHTML = db.caixa.slice().sort(porData).map(c => `<div class="item">
    <div class="t"><b>${c.desc}</b> ${c.tipo === 'aporte' ? '<span class="tag g">entrada</span>' : ''}<br><span class="muted">${dataBR(c.data)}</span></div>
    <div class="r"><span class="num">${c.tipo === 'aporte' ? '+' : '−'} ${brl(c.valor)}</span>${btnEdit(`editarCaixa('${c.id}')`)}${btnDel(`del('caixa','${c.id}')`)}</div></div>`).join('')
    || vazio('Nenhuma movimentação');

  $('lista-pessoas').innerHTML = db.pessoas.map(p => `<div class="item"><span>${p.nome}</span>
    ${btnDel(`delPessoa('${p.id}')`)}</div>`).join('');
}

function addPessoa() {
  const n = $('p-nome').value.trim();
  if (!n) return;
  db.pessoas.push({ id: uid(), nome: n });
  $('p-nome').value = '';
  salvar();
}

function delPessoa(id) {
  const usada = db.gastos.some(g => g.pagou === id || g.part.includes(id)) || db.acertos.some(a => a.de === id || a.para === id);
  if (usada) return alert('Essa pessoa já tem gastos ou acertos. Edite ou apague-os antes.');
  db.pessoas = db.pessoas.filter(p => p.id !== id);
  salvar();
}

function salvarGasto() {
  const valor = cents($('g-valor').value);
  const part = [...$('g-part').querySelectorAll('input:checked')].map(i => i.value);
  if (!$('g-desc').value.trim() || !(valor > 0) || !$('g-pagou').value || !part.length)
    return alert('Preencha descrição, valor, quem pagou e ao menos uma pessoa.');
  const g = { id: editGasto || uid(), desc: $('g-desc').value.trim(), valor, data: $('g-data').value || hoje(), pagou: $('g-pagou').value, part };
  if (editGasto) db.gastos = db.gastos.map(x => x.id === editGasto ? g : x);
  else db.gastos.push(g);
  limparGasto();
  salvar();
}

function editarGasto(id) {
  const g = db.gastos.find(x => x.id === id);
  editGasto = id;
  $('g-desc').value = g.desc; $('g-valor').value = g.valor / 100; $('g-data').value = g.data; $('g-pagou').value = g.pagou;
  renderPart(g.part);
  modoEdicao('g', true, 'Editar gasto', 'Salvar alterações');
}

function limparGasto() {
  editGasto = null;
  $('g-desc').value = $('g-valor').value = ''; $('g-data').value = hoje();
  renderPart();
  modoEdicao('g', false, 'Novo gasto', 'Adicionar gasto');
}

function salvarCaixa() {
  const valor = cents($('c-valor').value);
  const tipo = document.querySelector('input[name=ctipo]:checked').value;
  const desc = $('c-desc').value.trim() || (tipo === 'aporte' ? 'Valor adicionado' : '');
  if (!desc || !(valor > 0)) return alert('Preencha descrição e valor.');
  const c = { id: editCaixa || uid(), tipo, desc, valor, data: $('c-data').value || hoje() };
  if (editCaixa) db.caixa = db.caixa.map(x => x.id === editCaixa ? c : x);
  else db.caixa.push(c);
  limparCaixa();
  salvar();
}

function editarCaixa(id) {
  const c = db.caixa.find(x => x.id === id);
  editCaixa = id;
  document.querySelector(`input[name=ctipo][value=${c.tipo}]`).checked = true;
  $('c-desc').value = c.desc; $('c-valor').value = c.valor / 100; $('c-data').value = c.data;
  modoEdicao('c', true, 'Editar movimentação', 'Salvar alterações');
}

function limparCaixa() {
  editCaixa = null;
  $('c-desc').value = $('c-valor').value = ''; $('c-data').value = hoje();
  modoEdicao('c', false, 'Movimentar caixinha', 'Salvar');
}

function modoEdicao(p, on, titulo, botao) {
  $(p + '-titulo').textContent = titulo;
  $(p + '-btn').textContent = botao;
  $(p + '-cancel').classList.toggle('hide', !on);
  $(p + '-card').classList.toggle('editing', on);
  if (on) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function addAcerto() {
  const valor = cents($('a-valor').value), de = $('a-de').value, para = $('a-para').value;
  if (!(valor > 0) || !de || de === para) return alert('Escolha duas pessoas diferentes e um valor.');
  db.acertos.push({ id: uid(), de, para, valor, data: $('a-data').value || hoje() });
  $('a-valor').value = '';
  salvar();
}

function quitar(de, para, valor) {
  if (!confirm(`Registrar que ${nome(de)} pagou ${brl(valor)} para ${nome(para)}?`)) return;
  db.acertos.push({ id: uid(), de, para, valor, data: hoje() });
  salvar();
}

function del(lista, id) {
  if (!confirm('Apagar este item?')) return;
  db[lista] = db[lista].filter(x => x.id !== id);
  if (id === editGasto) limparGasto();
  if (id === editCaixa) limparCaixa();
  salvar();
}

function exportar() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = `viagem-backup-${hoje()}.json`;
  a.click();
}

function importar(input) {
  const f = input.files[0];
  if (!f || !confirm('Substituir os dados atuais pelo backup?')) return;
  f.text().then(t => { db = JSON.parse(t); location.reload(localStorage.setItem(KEY, JSON.stringify(db))); });
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button, .tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  $('t-' + b.dataset.t).classList.add('on');
  window.scrollTo(0, 0);
});

['g-data', 'c-data', 'a-data'].forEach(id => $(id).value = hoje());
salvar();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
