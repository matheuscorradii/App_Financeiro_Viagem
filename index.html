<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312E81">
<link rel="manifest" href="manifest.json">
<title>Rachaí</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- INÍCIO -->
<section class="tab on" id="t-resumo">
  <div class="hero compact"><div class="wrap">
    <div class="top"><div class="brand">Rach<i>aí</i></div><div class="pill" id="hd-total"></div></div>
  </div></div>
  <div class="wrap">
    <div class="stats float">
      <div class="stat"><div class="k">Total dividido</div><div class="v" id="r-total"></div></div>
      <div class="stat"><div class="k">Saldo da caixinha</div><div class="v" id="r-caixa"></div></div>
    </div>
    <h3>Saldo de cada um</h3><div class="card" id="saldos"></div>
    <h3>Quem deve a quem</h3><div class="card" id="sugestoes"></div>
    <h3>Gastos <small id="r-qtd"></small></h3><div class="card" id="r-gastos"></div>
    <h3>Pagamentos de acerto</h3><div class="card" id="acertos"></div>
  </div>
</section>

<!-- GASTOS -->
<section class="tab" id="t-gastos">
  <div class="hero small"><div class="wrap"><h1 id="g-titulo">Novo gasto</h1></div></div>
  <div class="wrap">
    <div class="card pad" id="g-card" style="margin-top:16px">
      <label style="margin-top:0">Valor</label><input id="g-valor" type="number" step="0.01" inputmode="decimal" placeholder="R$ 0,00" style="font-size:24px;font-weight:600">
      <label>Descrição</label><input id="g-desc" placeholder="Hotel, Uber, ingresso...">
      <div class="row">
        <div><label>Data</label><input id="g-data" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" oninput="mascaraData(this)"></div>
        <div><label>Quem pagou</label><select id="g-pagou" onchange="mostrarPart()"></select></div>
      </div>
      <div id="g-divide"><label>Dividir entre</label><div class="chips" id="g-part"></div></div>
      <button class="btn ghost" id="g-btn" onclick="salvarGasto()">Adicionar gasto</button>
      <button class="btn ghost hide" id="g-cancel" onclick="limparGasto()">Cancelar edição</button>
    </div>
    <h3>Todos os gastos</h3><div class="card" id="lista-gastos"></div>
  </div>
</section>

<!-- ACERTO -->
<section class="tab" id="t-acerto">
  <div class="hero small"><div class="wrap"><h1>Registrar acerto</h1></div></div>
  <div class="wrap">
    <div class="card pad" id="a-card" style="margin-top:16px">
      <div class="row">
        <div><label style="margin-top:0">Quem pagou</label><select id="a-de"></select></div>
        <div><label style="margin-top:0">Para quem</label><select id="a-para"></select></div>
      </div>
      <div class="row">
        <div><label>Valor</label><input id="a-valor" type="number" step="0.01" inputmode="decimal" placeholder="R$ 0,00"></div>
        <div><label>Data</label><input id="a-data" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" oninput="mascaraData(this)"></div>
      </div>
      <button class="btn ghost" onclick="addAcerto()">Registrar acerto</button>
    </div>
    <h3>Histórico</h3><div class="card" id="lista-acertos"></div>
  </div>
</section>

<!-- CAIXINHA -->
<section class="tab" id="t-caixa">
  <div class="hero"><div class="wrap">
    <div class="lbl" style="margin-top:4px">Saldo da caixinha Pix</div>
    <div class="amount" id="cx-saldo"></div>
    <div class="lbl" style="margin-top:4px" id="cx-info"></div>
  </div></div>
  <div class="wrap">
    <div class="card pad" id="c-card" style="margin-top:-48px;position:relative">
      <label style="margin-top:0">Adicionar valor</label><input id="c-valor" type="number" step="0.01" inputmode="decimal" placeholder="R$ 0,00" style="font-size:24px;font-weight:600">
      <div class="row">
        <div><label>Descrição</label><input id="c-desc" placeholder="Pix da Ana..."></div>
        <div><label>Data</label><input id="c-data" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" oninput="mascaraData(this)"></div>
      </div>
      <button class="btn ghost" id="c-btn" onclick="salvarCaixa()">Salvar</button>
      <button class="btn ghost hide" id="c-cancel" onclick="limparCaixa()">Cancelar edição</button>
      <span id="c-titulo" class="hide"></span>
    </div>
    <h3>Movimentações</h3><div class="card" id="lista-caixa"></div>
  </div>
</section>

<!-- PESSOAS -->
<section class="tab" id="t-pessoas">
  <div class="hero small"><div class="wrap"><h1>Pessoas</h1></div></div>
  <div class="wrap">
    <div class="search" style="margin-top:16px">
      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="p-nome" placeholder="Buscar ou adicionar nome" oninput="render()" onkeydown="if(event.key==='Enter')addPessoa()">
      </div>
      <button class="round" onclick="addPessoa()" aria-label="Adicionar pessoa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <h3>Grupo da viagem</h3><div class="card" id="lista-pessoas"></div>
    <h3>Backup</h3>
    <div class="card pad">
      <div style="font-size:14px;color:var(--muted)">Os dados ficam só neste celular. Exporte de vez em quando.</div>
      <div class="row">
        <button class="btn ghost" onclick="exportar()">Exportar</button>
        <button class="btn ghost" onclick="document.getElementById('imp').click()">Importar</button>
      </div>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(this)">
    </div>
  </div>
</section>

<nav><div class="in">
  <button class="on" data-t="resumo" aria-label="Início"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-t="acerto" aria-label="Acerto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/></svg></button>
  <button class="fab" onclick="ir('gastos');limparGasto();setTimeout(()=>$('g-valor').focus(),100)" aria-label="Novo gasto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="caixa" aria-label="Caixinha"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20M16 15h2"/></svg></button>
  <button data-t="pessoas" aria-label="Pessoas"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/></svg></button>
</div></nav>

<script>
const KEY = 'viagem-contas';
let db = JSON.parse(localStorage.getItem(KEY) || 'null') ||
  { pessoas: [], gastos: [], caixa: [], acertos: [] };
// migra versão antiga (valor inicial único) para movimentação de aporte
if (db.caixaInicial) db.caixa.unshift({ id: 'ini', tipo: 'aporte', desc: 'Valor inicial', valor: db.caixaInicial, data: (db.caixa[0] || {}).data || new Date().toISOString().slice(0, 10) });
delete db.caixaInicial;
db.caixa.forEach(c => c.tipo = c.tipo || 'gasto');

let editGasto = null, editCaixa = null;

const $ = id => document.getElementById(id);
const brl = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const cents = v => Math.round(parseFloat(String(v).replace(',', '.')) * 100);
const hoje = () => new Date().toISOString().slice(0, 10);
const dataBR = d => d.split('-').reverse().join('/');
// DD/MM/AAAA -> AAAA-MM-DD; '' se a data não existir.
const dataISO = s => {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
  if (!m) return '';
  const d = new Date(+m[3], m[2] - 1, +m[1]);
  return d.getDate() === +m[1] && d.getMonth() === m[2] - 1 ? `${m[3]}-${m[2]}-${m[1]}` : '';
};
const mascaraData = el => {
  const n = el.value.replace(/\D/g, '').slice(0, 8);
  el.value = n.length > 4 ? `${n.slice(0, 2)}/${n.slice(2, 4)}/${n.slice(4)}` : n.length > 2 ? `${n.slice(0, 2)}/${n.slice(2)}` : n;
};
// Data do campo em AAAA-MM-DD (hoje se vazio); avisa e devolve '' se inválida.
const lerData = id => {
  const d = $(id).value ? dataISO($(id).value) : hoje();
  if (!d) alert('Data inválida. Use o formato DD/MM/AAAA.');
  return d;
};
// "Quem pagou" especial: gasto pago com a caixinha não é dividido entre pessoas.
const CAIXA = 'caixa';
const nome = id => id === CAIXA ? 'Caixinha Pix' : (db.pessoas.find(p => p.id === id) || { nome: '?' }).nome;
const ini = n => n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const porData = (a, b) => b.data.localeCompare(a.data);
const salvar = () => { localStorage.setItem(KEY, JSON.stringify(db)); render(); };
const ICON_EDIT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>';
const ICON_DEL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const btnEdit = fn => `<button class="icon-btn" onclick="${fn}" aria-label="Editar">${ICON_EDIT}</button>`;
const btnDel = fn => `<button class="icon-btn" onclick="${fn}" aria-label="Apagar">${ICON_DEL}</button>`;
const vazio = t => `<div class="empty">${t}</div>`;
const av = (txt, dark) => `<div class="av${dark ? ' dark' : ''}">${txt}</div>`;

// Saldo > 0: tem a receber. Saldo < 0: deve.
function saldos() {
  const s = {};
  db.pessoas.forEach(p => s[p.id] = 0);
  db.gastos.forEach(g => {
    if (g.pagou === CAIXA) return;
    const n = g.part.length, base = Math.floor(g.valor / n);
    s[g.pagou] = (s[g.pagou] || 0) + g.valor;
    // centavos que sobram vão para os primeiros participantes
    g.part.forEach((id, i) => s[id] = (s[id] || 0) - base - (i < g.valor - base * n ? 1 : 0));
  });
  db.acertos.forEach(a => { s[a.de] += a.valor; s[a.para] -= a.valor; });
  return s;
}

function sugestoes(s) {
  const dev = [], rec = [];
  for (const id in s) {
    if (s[id] < 0) dev.push({ id, v: -s[id] });
    if (s[id] > 0) rec.push({ id, v: s[id] });
  }
  dev.sort((a, b) => b.v - a.v); rec.sort((a, b) => b.v - a.v);
  const out = [];
  let i = 0, j = 0;
  while (i < dev.length && j < rec.length) {
    const v = Math.min(dev[i].v, rec[j].v);
    out.push({ de: dev[i].id, para: rec[j].id, valor: v });
    dev[i].v -= v; rec[j].v -= v;
    if (!dev[i].v) i++;
    if (!rec[j].v) j++;
  }
  return out;
}

const linhaGasto = (g, acoes) => `<div class="item">${av(ini(nome(g.pagou)))}
  <div class="t"><b>${g.desc}</b><span>${dataBR(g.data)} · ${g.pagou === CAIXA ? 'pago com a caixinha' : `${nome(g.pagou)} pagou · ${g.part.length === db.pessoas.length ? 'todos' : g.part.map(nome).join(', ')}`}</span></div>
  <div class="v">${brl(g.valor)}</div>${acoes ? `<div class="acts">${btnEdit(`editarGasto('${g.id}')`)}${btnDel(`del('gastos','${g.id}')`)}</div>` : ''}</div>`;

function renderPart(marcados) {
  $('g-part').innerHTML = db.pessoas.map(p =>
    `<label><input type="checkbox" value="${p.id}" ${marcados && marcados.includes(p.id) ? 'checked' : ''}>${p.nome}</label>`).join('') || '<span class="empty">Cadastre pessoas primeiro</span>';
}

const mostrarPart = () => $('g-divide').classList.toggle('hide', $('g-pagou').value === CAIXA);

function render() {
  const opts = db.pessoas.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
  ['g-pagou', 'a-de', 'a-para'].forEach(id => {
    const v = $(id).value;
    $(id).innerHTML = opts + (id === 'g-pagou' ? `<option value="${CAIXA}">Caixinha Pix</option>` : '');
    if (v) $(id).value = v;
  });
  if (!editGasto) renderPart();
  mostrarPart();

  const s = saldos();
  const total = db.gastos.filter(g => g.pagou !== CAIXA).reduce((t, g) => t + g.valor, 0);
  // Movimentações antigas do tipo "gasto" + gastos pagos com a caixinha.
  const movCaixa = db.caixa.concat(db.gastos.filter(g => g.pagou === CAIXA).map(g => ({ ...g, tipo: 'gasto', doGasto: true })));
  const aportes = db.caixa.filter(c => c.tipo === 'aporte').reduce((t, c) => t + c.valor, 0);
  const cx = movCaixa.reduce((t, c) => t + (c.tipo === 'aporte' ? c.valor : -c.valor), 0);
  $('cx-saldo').textContent = brl(cx);
  $('r-total').textContent = brl(total);
  $('r-caixa').textContent = brl(cx);
  $('r-qtd').textContent = db.gastos.length + (db.gastos.length === 1 ? ' item' : ' itens');
  $('hd-total').textContent = db.pessoas.length + ' pessoas';
  $('cx-info').textContent = `Entrou ${brl(aportes)} · gasto ${brl(aportes - cx)}`;

  $('saldos').innerHTML = db.pessoas.map(p => `<div class="item">${av(ini(p.nome))}
    <div class="t"><b>${p.nome}</b><span>${s[p.id] < 0 ? 'deve' : s[p.id] > 0 ? 'tem a receber' : 'tudo certo'}</span></div>
    <div class="v ${s[p.id] < 0 ? 'neg' : s[p.id] > 0 ? 'pos' : ''}">${brl(Math.abs(s[p.id]))}</div></div>`).join('')
    || vazio('Cadastre as pessoas na aba Pessoas');

  $('sugestoes').innerHTML = sugestoes(s).map(t => `<div class="item">${av(ini(nome(t.de)), true)}
    <div class="t"><b>${nome(t.de)} → ${nome(t.para)}</b><span class="neg">${brl(t.valor)}</span></div>
    <button class="btn ghost sm" onclick="quitar('${t.de}','${t.para}',${t.valor})">Quitar</button></div>`).join('')
    || vazio('Tudo acertado');

  const gastos = db.gastos.slice().sort(porData);
  $('r-gastos').innerHTML = gastos.map(g => linhaGasto(g, false)).join('') || vazio('Nenhum gasto');
  $('lista-gastos').innerHTML = gastos.map(g => linhaGasto(g, true)).join('') || vazio('Nenhum gasto');

  $('acertos').innerHTML = $('lista-acertos').innerHTML = db.acertos.slice().sort(porData).map(a => `<div class="item">${av(ini(nome(a.de)))}
    <div class="t"><b>${nome(a.de)} → ${nome(a.para)}</b><span>${dataBR(a.data)}</span></div>
    <div class="v">${brl(a.valor)}</div><div class="acts">${btnDel(`del('acertos','${a.id}')`)}</div></div>`).join('')
    || vazio('Nenhum pagamento ainda');

  $('lista-caixa').innerHTML = movCaixa.sort(porData).map(c => `<div class="item">
    ${av(c.tipo === 'aporte' ? '+' : '−', c.tipo === 'aporte')}
    <div class="t"><b>${c.desc}</b><span>${dataBR(c.data)}</span></div>
    <div class="v ${c.tipo === 'aporte' ? 'pos' : ''}">${c.tipo === 'aporte' ? '+' : '−'} ${brl(c.valor)}</div>
    <div class="acts">${c.doGasto
      ? btnEdit(`ir('gastos');editarGasto('${c.id}')`) + btnDel(`del('gastos','${c.id}')`)
      : btnEdit(`editarCaixa('${c.id}')`) + btnDel(`del('caixa','${c.id}')`)}</div></div>`).join('')
    || vazio('Nenhuma movimentação');

  const busca = $('p-nome').value.trim().toLowerCase();
  $('lista-pessoas').innerHTML = db.pessoas.filter(p => p.nome.toLowerCase().includes(busca)).map(p => `<div class="item">${av(ini(p.nome))}
    <div class="t"><b>${p.nome}</b><span>${brl(Math.abs(s[p.id]))} ${s[p.id] < 0 ? 'a pagar' : 'a receber'}</span></div>
    <div class="acts">${btnDel(`delPessoa('${p.id}')`)}</div></div>`).join('')
    || vazio(busca ? 'Toque no + para adicionar' : 'Ninguém ainda');
}

function ir(tab, alvo) {
  document.querySelectorAll('nav button, .tab').forEach(x => x.classList.remove('on'));
  const b = document.querySelector(`nav [data-t=${tab}]`);
  if (b) b.classList.add('on');
  $('t-' + tab).classList.add('on');
  if (alvo) setTimeout(() => $(alvo).scrollIntoView({ behavior: 'smooth' }), 50);
  else window.scrollTo(0, 0);
}

function addPessoa() {
  const n = $('p-nome').value.trim();
  if (!n) return $('p-nome').focus();
  db.pessoas.push({ id: uid(), nome: n });
  $('p-nome').value = '';
  salvar();
}

function delPessoa(id) {
  const usada = db.gastos.some(g => g.pagou === id || g.part.includes(id)) || db.acertos.some(a => a.de === id || a.para === id);
  if (usada) return alert('Essa pessoa já tem gastos ou acertos. Edite ou apague-os antes.');
  db.pessoas = db.pessoas.filter(p => p.id !== id);
  salvar();
}

function salvarGasto() {
  const valor = cents($('g-valor').value);
  const pagaCaixa = $('g-pagou').value === CAIXA;
  const part = pagaCaixa ? [] : [...$('g-part').querySelectorAll('input:checked')].map(i => i.value);
  if (!$('g-desc').value.trim() || !(valor > 0) || !$('g-pagou').value || (!pagaCaixa && !part.length))
    return alert('Preencha descrição, valor, quem pagou e ao menos uma pessoa.');
  const data = lerData('g-data');
  if (!data) return;
  const g = { id: editGasto || uid(), desc: $('g-desc').value.trim(), valor, data, pagou: $('g-pagou').value, part };
  if (editGasto) db.gastos = db.gastos.map(x => x.id === editGasto ? g : x);
  else db.gastos.push(g);
  limparGasto();
  salvar();
}

function editarGasto(id) {
  const g = db.gastos.find(x => x.id === id);
  editGasto = id;
  $('g-desc').value = g.desc; $('g-valor').value = g.valor / 100; $('g-data').value = dataBR(g.data); $('g-pagou').value = g.pagou;
  renderPart(g.part);
  mostrarPart();
  modoEdicao('g', true, 'Editar gasto', 'Salvar alterações');
}

function limparGasto() {
  editGasto = null;
  $('g-desc').value = $('g-valor').value = ''; $('g-data').value = dataBR(hoje());
  renderPart();
  modoEdicao('g', false, 'Novo gasto', 'Adicionar gasto');
}

function salvarCaixa() {
  const valor = cents($('c-valor').value);
  // Só se adiciona valor aqui; movimentações antigas de gasto mantêm o tipo ao editar.
  const tipo = editCaixa ? db.caixa.find(x => x.id === editCaixa).tipo : 'aporte';
  const desc = $('c-desc').value.trim() || (tipo === 'aporte' ? 'Valor adicionado' : '');
  if (!desc || !(valor > 0)) return alert('Preencha descrição e valor.');
  const data = lerData('c-data');
  if (!data) return;
  const c = { id: editCaixa || uid(), tipo, desc, valor, data };
  if (editCaixa) db.caixa = db.caixa.map(x => x.id === editCaixa ? c : x);
  else db.caixa.push(c);
  limparCaixa();
  salvar();
}

function editarCaixa(id) {
  const c = db.caixa.find(x => x.id === id);
  editCaixa = id;
  $('c-desc').value = c.desc; $('c-valor').value = c.valor / 100; $('c-data').value = dataBR(c.data);
  modoEdicao('c', true, 'Editar movimentação', 'Salvar alterações');
}

function limparCaixa() {
  editCaixa = null;
  $('c-desc').value = $('c-valor').value = ''; $('c-data').value = dataBR(hoje());
  modoEdicao('c', false, 'Movimentar caixinha', 'Salvar');
}

function modoEdicao(p, on, titulo, botao) {
  $(p + '-titulo').textContent = titulo;
  $(p + '-btn').textContent = botao;
  $(p + '-cancel').classList.toggle('hide', !on);
  $(p + '-card').classList.toggle('editing', on);
  if (on) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function addAcerto() {
  const valor = cents($('a-valor').value), de = $('a-de').value, para = $('a-para').value;
  if (!(valor > 0) || !de || de === para) return alert('Escolha duas pessoas diferentes e um valor.');
  const data = lerData('a-data');
  if (!data) return;
  db.acertos.push({ id: uid(), de, para, valor, data });
  $('a-valor').value = '';
  salvar();
}

function quitar(de, para, valor) {
  if (!confirm(`Registrar que ${nome(de)} pagou ${brl(valor)} para ${nome(para)}?`)) return;
  db.acertos.push({ id: uid(), de, para, valor, data: hoje() });
  salvar();
}

function del(lista, id) {
  if (!confirm('Apagar este item?')) return;
  db[lista] = db[lista].filter(x => x.id !== id);
  if (id === editGasto) limparGasto();
  if (id === editCaixa) limparCaixa();
  salvar();
}

function exportar() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = `rachai-backup-${hoje()}.json`;
  a.click();
}

function importar(input) {
  const f = input.files[0];
  if (!f || !confirm('Substituir os dados atuais pelo backup?')) return;
  f.text().then(t => { db = JSON.parse(t); location.reload(localStorage.setItem(KEY, JSON.stringify(db))); });
}

document.querySelectorAll('nav button[data-t]').forEach(b => b.onclick = () => ir(b.dataset.t));

['g-data', 'c-data', 'a-data'].forEach(id => $(id).value = dataBR(hoje()));
salvar();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
